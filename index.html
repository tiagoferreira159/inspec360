'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():('i'+Date.now()+Math.random().toString(36).slice(2));
const dbName='inspec360_v1', stores=['condos','inspections','areas','items','findings','photos','settings','users'];let state={page:'dashboard',inspectionId:null,areaId:null,itemId:null,reportMode:'all',reportLayout:'pair',search:''},urls=new Set();
let D={};function by(s,id){return D[s].find(x=>x.id===id)}function child(s,key,id){return D[s].filter(x=>x[key]===id)}function opt(label,values,cur){return `<label class="field"><span>${label}</span><select name="${values.name||''}">${values.entries.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}function field(name,label,value='',type='text',required=false){return `<div class="field"><label for="f-${name}">${label}</label>${type==='textarea'?`<textarea id="f-${name}" name="${name}">${esc(value)}</textarea>`:`<input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`}</div>`}function select(name,label,opts,cur){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
const icons={dashboard:'◫',condos:'▥',inspections:'☷',photos:'▧',reports:'▤',templates:'▦',settings:'⚙',users:'♙',backup:'↥'};const pages=[['dashboard','Dashboard'],['condos','Condomínios'],['inspections','Inspeções'],['photos','Galeria fotográfica'],['reports','Laudos técnicos'],['templates','Modelos e listas'],['settings','Configurações / backup'],['users','Gestão de acessos']];function navigate(p,id){if(!sessionUser)return; if(p==='users'&&!isAdmin())return;state.page=p;if(id!==undefined)state.inspectionId=id;state.areaId=null;state.itemId=null;render()};function btn(text,action,extra='',klass=''){return `<button type="button" class="btn ${klass}" data-action="${action}" ${extra}>${text}</button>`}function statusTag(s){let c=/Conforme|Conclu|Final|Revisad/i.test(s)?'green':/Não conforme|Crític/i.test(s)?'red':/andamento|Pendente/i.test(s)?'yellow':'';return `<span class="tag ${c}">${esc(s)}</span>`}function counts(ins){let its=child('items','inspectionId',ins.id),done=its.filter(i=>!['Pendente','Não inspecionado'].includes(i.status));return {n:its.length,done:done.length,pct:its.length?Math.round(done.length/its.length*100):0}}
function render(){if(!sessionUser){showAuth();return}urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();$('#nav').innerHTML=pages.filter(([id])=>id!=='users'||isAdmin()).map(([id,n])=>`<button class="navbtn ${state.page===id?'on':''}" data-page="${id}"><b>${icons[id]}</b>${n}</button>`).join('');let names={dashboard:'Visão geral',condos:'Condomínios',inspections:'Inspeções',workspace:'Área de inspeção',photos:'Galeria fotográfica',reports:'Laudos técnicos',templates:'Modelos de inspeção',settings:'Configurações e proteção dos dados',users:'Gestão de acessos'};$('#page-title').textContent=names[state.page];$('#signed-user').textContent=sessionUser.name+' · '+roleLabels[sessionUser.role];$('#page-sub').textContent=state.page==='workspace'?by('inspections',state.inspectionId)?.title||'Inspeção':'Inspec360 · nuvem · v4';$('#content').innerHTML=({dashboard:renderDashboard,condos:renderCondos,inspections:renderInspections,workspace:renderWorkspace,photos:renderPhotos,reports:renderReports,templates:renderTemplates,settings:renderSettings,users:renderUsers}[state.page]||renderDashboard)()}
function renderDashboard(){let ins=D.inspections,items=D.items,photos=D.photos,findings=D.findings;return `<div class="row between toolbar"><div><h2 style="margin:0">Bem-vindo ao Inspec360</h2><div class="hint">Controle seus trabalhos do campo ao laudo final.</div></div>${btn('+ Nova inspeção','newInspection','','primary')}</div><div class="stats">${[['Condomínios',D.condos.length],['Inspeções',ins.length],['Itens inspecionados',items.filter(i=>i.status!=='Pendente'&&i.status!=='Não inspecionado').length],['Fotografias',photos.length],['Constatações',findings.length],['Em andamento',ins.filter(i=>i.status==='Em andamento').length],['Itens pendentes',items.filter(i=>i.status==='Pendente'||i.status==='Não inspecionado').length],['Finalizadas',ins.filter(i=>i.status==='Concluída').length]].map(([a,b])=>`<div class="stat"><strong>${b}</strong><span>${a}</span></div>`).join('')}</div><div class="card" style="margin-top:18px"><h2>Inspeções recentes</h2>${renderInsTable(ins.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,8))}</div>`}
function renderInsTable(arr){return arr.length?`<div class="tablewrap"><table><thead><tr><th>Inspeção</th><th>Condomínio</th><th>Situação</th><th>Avanço</th><th>Ações</th></tr></thead><tbody>${arr.map(x=>{let k=counts(x);return `<tr><td><strong>${esc(x.title)}</strong><div class="hint">${esc(x.date||'Sem data')}</div></td><td>${esc(by('condos',x.condoId)?.name||'—')}</td><td>${statusTag(x.status)}</td><td><div class="progress" style="min-width:95px"><div style="width:${k.pct}%"></div></div><span class="hint">${k.done}/${k.n} · ${k.pct}%</span></td><td>${btn('Abrir','openInspection',`data-id="${x.id}"`,'sm')} ${btn('Editar','editInspection',`data-id="${x.id}"`,'sm')}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Nenhuma inspeção cadastrada.<br><br>${btn('Criar inspeção','newInspection','','primary')}</div>`}
function renderCondos(){return `<div class="row between toolbar"><div class="hint">Cadastre os empreendimentos que deseja inspecionar.</div>${btn('+ Novo condomínio','newCondo','','primary')}</div>${D.condos.length?`<div class="grid3">${D.condos.map(c=>`<div class="card"><h2>▥ ${esc(c.name)}</h2><p class="hint">${esc([c.address,c.city,c.state].filter(Boolean).join(', ')||'Endereço não informado')}</p><p>${child('inspections','condoId',c.id).length} inspeções registradas</p><div class="row">${btn('Editar','editCondo',`data-id="${c.id}"`,'sm')}${btn('Inspeções','filterCondo',`data-id="${c.id}"`,'sm')}${btn('Excluir','deleteCondo',`data-id="${c.id}"`,'sm danger')}</div></div>`).join('')}</div>`:`<div class="empty">Comece cadastrando o Condomínio Aziz Ary.</div>`}`}
function renderInspections(){let rows=state.search?D.inspections.filter(i=>i.condoId===state.search):D.inspections;return `<div class="row between toolbar"><div class="row">${select('filter','Filtrar condomínio',[['','Todos'],...D.condos.map(c=>[c.id,c.name])],state.search)}</div>${btn('+ Nova inspeção','newInspection','','primary')}</div><div class="card">${renderInsTable(rows)}</div>`}
function renderWorkspace(){let ins=by('inspections',state.inspectionId);if(!ins)return `<div class="empty">Inspeção não encontrada</div>`;let areas=child('areas','inspectionId',ins.id).sort((a,b)=>(a.order||0)-(b.order||0)),items=child('items','inspectionId',ins.id),k=counts(ins);let ar=by('areas',state.areaId),item=by('items',state.itemId);return `<div class="row between toolbar"><div><button class="btn sm" data-page="inspections">← Inspeções</button> <strong>${esc(ins.title)}</strong> · ${esc(by('condos',ins.condoId)?.name||'')}</div><div class="row">${btn('Editar inspeção','editInspection',`data-id="${ins.id}"`,'sm')}${btn('Gerar laudo','openReport',`data-id="${ins.id}"`,'primary')}</div></div><div class="card"><div class="row between"><div><b>Progresso da vistoria</b><div class="hint">${k.done} de ${k.n} itens avaliados</div></div><strong>${k.pct}%</strong></div><div class="progress" style="margin-top:11px"><div style="width:${k.pct}%"></div></div></div><div class="split"><div class="card tree"><div class="row between"><h2>Ambientes e verificações</h2>${btn('+ Área','newArea','','sm')}</div>${canEdit()?btn('Organizar ordem das áreas','orderAreas','','sm'):''}${areas.length?areas.map(a=>`<button class="${state.areaId===a.id?'on':''}" data-action="chooseArea" data-id="${a.id}">▸ ${esc(a.name)} <span class="hint">(${child('items','areaId',a.id).length})</span></button>${state.areaId===a.id?child('items','areaId',a.id).sort((x,y)=>(x.order||0)-(y.order||0)).map(i=>`<button class="item ${state.itemId===i.id?'on':''}" data-action="chooseItem" data-id="${i.id}">○ ${esc(i.name)}</button>`).join(''):''}`).join(''):`<div class="hint">Adicione sua primeira área ou aplique um modelo.</div>`}<hr style="border:0;border-top:1px solid var(--line)">${btn('Aplicar modelo básico','applyTemplate','','sm')}</div><div>${item?renderItem(item,ar):ar?renderArea(ar):`<div class="card"><h2>Selecione um ambiente</h2><p class="hint">Escolha uma área à esquerda para incluir ou avaliar os itens. É possível adicionar quantas fotografias forem necessárias.</p>${areas.length?btn('Abrir primeiro ambiente','chooseArea',`data-id="${areas[0].id}"`):''}</div>`}</div></div>`}
function renderArea(a){let its=child('items','areaId',a.id).sort((x,y)=>(x.order||0)-(y.order||0));return `<div class="card"><div class="row between"><div><h2 style="margin:0">${esc(a.name)}</h2><span class="hint">${its.length} itens de verificação</span></div><div class="row">${btn('Editar','editArea',`data-id="${a.id}"`,'sm')}${btn('Excluir','deleteArea',`data-id="${a.id}"`,'sm danger')}${btn('+ Item','newItem','','primary')}</div></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Resultado</th><th>Fotos</th><th></th></tr></thead><tbody>${its.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${statusTag(i.status)}</td><td>${child('photos','itemId',i.id).length}</td><td>${btn('Inspecionar','chooseItem',`data-id="${i.id}"`,'sm')}</td></tr>`).join('')}</tbody></table></div>${!its.length?'<p class="hint">Nenhum item cadastrado nesta área.</p>':''}</div>`}
function renderItem(item,ar){let finds=child('findings','itemId',item.id),pics=child('photos','itemId',item.id).sort((a,b)=>(a.order||0)-(b.order||0));return `<div class="card"><div class="row between"><div><div class="hint">${esc(ar?.name||'Ambiente')}</div><h2 style="margin:0 0 3px">${esc(item.name)}</h2>${statusTag(item.status)}</div><div class="row">${btn('Editar item','editItem',`data-id="${item.id}"`,'sm')}${btn('Excluir','deleteItem',`data-id="${item.id}"`,'sm danger')}</div></div><form id="item-status" style="margin-top:18px"><div class="grid2">${select('status','Resultado da verificação',['Pendente','Conforme','Não conforme','Não aplicável','Não inspecionado','Requer avaliação complementar'],item.status)}${field('notes','Notas gerais do item',item.notes||'','textarea')}</div><button class="btn primary" type="submit">Salvar avaliação</button></form></div><div class="card"><div class="row between"><h2>Constatações técnicas (${finds.length})</h2>${btn('+ Nova constatação','newFinding','','primary')}</div>${finds.length?finds.map(f=>`<div style="border:1px solid var(--line);padding:13px;border-radius:10px;margin-bottom:10px"><div class="row between"><strong>${esc(f.title||'Constatação')}</strong><div>${btn('Editar','editFinding',`data-id="${f.id}"`,'sm')}${btn('Excluir','deleteFinding',`data-id="${f.id}"`,'sm danger')}</div></div><p style="white-space:pre-line">${esc(f.description||'')}</p><div class="hint">Prioridade: ${esc(f.priority||'Não definida')} · Classificação: ${esc(f.classification||'Não definida')}</div>${f.recommendation?`<p><strong>Recomendação:</strong> ${esc(f.recommendation)}</p>`:''}</div>`).join(''):'<p class="hint">Inclua observações, anomalias e recomendações técnicas.</p>'}</div><div class="card"><div class="row between"><div><h2 style="margin:0">Registro fotográfico (${pics.length})</h2><p class="hint">As imagens serão automaticamente associadas a este item e inseridas no laudo.</p></div>${btn('Adicionar fotografias','uploadPhotos','','primary')}</div><div class="drop" data-action="uploadPhotos">📷 Clique para selecionar várias fotos ou arraste as imagens aqui</div><div style="height:15px"></div>${renderGallery(pics)}</div>`}
function renderGallery(pics){return pics.length?`<div class="gallery">${pics.map((p,index)=>{let src=urlPhoto(p);return `<div class="photo"><img alt="${esc(p.caption||'Foto')}" src="${src}" data-action="viewPhoto" data-id="${p.id}"><div class="meta"><b class="hint">Foto ${index+1}</b><p>${esc(p.caption||'Sem legenda')}</p><div class="actions">${btn('✎','editPhoto',`data-id="${p.id}" title="Editar legenda"`,'sm')}${btn('←','movePhoto',`data-id="${p.id}" data-dir="-1" title="Anterior"`,'sm')}${btn('→','movePhoto',`data-id="${p.id}" data-dir="1" title="Próxima"`,'sm')}${btn('✕','deletePhoto',`data-id="${p.id}" title="Excluir"`,'sm danger')}</div></div></div>`}).join('')}</div>`:'<p class="hint">Ainda não há fotografias neste item.</p>'}function urlPhoto(p){let u=URL.createObjectURL(p.blob);urls.add(u);return u}

const BASIC=['Portaria','Estacionamento','Áreas comuns','Salão de festas','Coworking','Apartamentos','Fachadas','Cobertura','Áreas técnicas'];const BASIC_ITEMS=['Pisos','Revestimentos','Alvenarias','Pintura e acabamentos','Instalações elétricas','Instalações hidrossanitárias','Esquadrias','Estruturas','Impermeabilização'];function renderTemplates(){return `<div class="card"><h2>Modelo inicial — Condomínio residencial</h2><p>Estrutura reutilizável com ${BASIC.length} ambientes e ${BASIC_ITEMS.length} itens-padrão por ambiente. Você pode editar ou remover qualquer registro após aplicar o modelo.</p><div class="grid2"><div><h3>Ambientes</h3>${BASIC.map(x=>`<p>▸ ${x}</p>`).join('')}</div><div><h3>Itens de verificação</h3>${BASIC_ITEMS.map(x=>`<p>○ ${x}</p>`).join('')}</div></div><p class="hint">Para aplicar, abra a inspeção e escolha “Aplicar modelo básico”. O modelo não altera inspeções anteriores.</p></div>`}
function renderSettings(){let s=by('settings','profile')||{};return `<div class="card"><h2>Dados do responsável técnico / modelo de laudo</h2><form id="settings-form"><div class="grid2">${field('engineer','Engenheiro responsável',s.engineer||'')}${field('crea','Registro profissional / CREA',s.crea||'')}${field('company','Empresa / escritório',s.company||'')}${field('contact','Contato',s.contact||'')}${field('reportTitle','Título padrão do laudo',s.reportTitle||'LAUDO TÉCNICO DE INSPEÇÃO PREDIAL')}${field('methodology','Metodologia / texto padrão',s.methodology||'','textarea')}</div><div class="card" style="background:#f8fafc"><h2>Logomarca do laudo</h2><p class="hint">Escolha PNG ou JPEG. A imagem será colocada na capa e incorporada ao Word.</p>${s.logo?`<img src="${esc(s.logo)}" alt="Logo atual" style="max-height:115px;max-width:300px;object-fit:contain">`:''}<div class="field"><label>Adicionar / substituir logomarca</label><input id="logo-upload" type="file" accept="image/png,image/jpeg"></div><label><input type="checkbox" name="removeLogo" value="yes"> Remover a logomarca atual</label></div><button class="btn primary" type="submit">Salvar configurações</button></form></div><div class="card"><h2>Backup e restauração</h2><p>Os dados são armazenados no Supabase. Faça backups completos regularmente. A importação inicial aceita apenas uma organização vazia e preserva os usuários da nuvem.</p><div class="row">${btn('Baixar backup completo (.json)','backup','','primary')}${btn('Importar backup inicial','restore')}${btn('Exportar dados sem fotos','backupLite')}</div><div class="alert">O arquivo de backup pode conter fotografias e dados pessoais. Guarde-o em local protegido. A importação inicial não substitui registros existentes. Usuários e senhas locais não são migrados.</div></div><div class="card"><h2>Uso do plano</h2><p>Consulte o consumo de banco, Storage e tráfego no painel Usage do Supabase. Fotografias novas são convertidas para JPEG, com até 1.800 pixels no maio async function save(s,o){if(!canEdit())throw Error('Acesso somente consulta');await put(s,o);await load();closeModal();render();toast('Alterações salvas com sucesso.')}function condoModal(id){let c=by('condos',id)||{};modal(id?'Editar condomínio':'Novo condomínio',`<div class="grid2">${field('name','Nome do condomínio',c.name||'Condomínio Aziz Ary','text',true)}${field('propertyType','Tipo do imóvel',c.propertyType||'')}${field('address','Endereço',c.address)}${field('neighborhood','Bairro',c.neighborhood)}${field('city','Cidade',c.city)}${field('state','Estado',c.state)}${field('zip','CEP',c.zip)}${field('cnpj','CNPJ',c.cnpj)}${field('manager','Síndico / responsável',c.manager)}${field('administrator','Administradora',c.administrator)}${field('email','E-mail',c.email,'email')}${field('blocks','Blocos / torres',c.blocks)}${field('units','Unidades',c.units)}</div>${field('notes','Informações adicionais',c.notes,'textarea')}`,'Salvar',async v=>save('condos',{...c,...v,id:id||uid(),created:c.created||new Date().toISOString()}),true)}
function inspectionModal(id){if(!D.condos.length){toast('Cadastre primeiro um condomínio.');condoModal();return}let i=by('inspections',id)||{};modal(id?'Editar inspeção':'Nova inspeção',`${select('condoId','Condomínio',D.condos.map(c=>[c.id,c.name]),i.condoId||D.condos[0].id)}${field('title','Título',i.title||'Inspeção Predial – '+new Date().getFullYear(),'text',true)}<div class="grid2">${field('date','Data de início',i.date||new Date().toISOString().slice(0,10),'date')}${select('status','Status',['Não iniciada','Em andamento','Em revisão','Concluída','Arquivada'],i.status||'Em andamento')}${field('engineer','Responsável técnico',i.engineer||by('settings','profile')?.engineer||'')}${field('crea','Registro profissional',i.crea||by('settings','profile')?.crea||'')}</div>${field('objective','Objetivo e escopo',i.objective,'textarea')}`,'Salvar',async v=>{let o={...i,...v,id:id||uid(),created:i.created||new Date().toISOString()};await save('inspections',o);state.page='workspace';state.inspectionId=o.id;render()},true)}

async function photoModal(id){let p=by('photos',id);if(!p)return;let src=urlPhoto(p);let thisItems=child('items','inspectionId',p.inspectionId);modal('Editar fotografia',`<img src="${src}" style="width:100%;max-height:300px;object-fit:contain;margin-bottom:12px">${field('caption','Legenda',p.caption||'')}${select('itemId','Vincular ao item',thisItems.map(i=>[i.id,`${by('areas',i.areaId)?.name||''} / ${i.name}`]),p.itemId)}${select('findingId','Constatação relacionada',[['','Sem vínculo específico'],...D.findings.filter(f=>f.inspectionId===p.inspectionId).map(f=>[f.id,f.title])],p.findingId||'')}`,'Salvar',async v=>{let item=by('items',v.itemId);await save('photos',{...p,...v,areaId:item.areaId})})}

async function addPhotos(files){if(!canEdit())throw Error('Acesso somente consulta');if(!state.itemId){toast('Selecione um item para adicionar fotos.');return}let imgs=Array.from(files||[]).filter(f=>f.type.startsWith('image/'));let existing=child('photos','itemId',state.itemId).length;try{for(let n=0;n<imgs.length;n++){let f=imgs[n];await put('photos',{id:uid(),itemId:state.itemId,inspectionId:state.inspectionId,areaId:state.areaId,blob:f,name:f.name,caption:'',order:existing+n,created:new Date().toISOString()})}await load();render();toast(`${imgs.length} foto(s) adicionada(s).`)}catch(e){console.error(e);toast('Falha ao salvar imagens: '+e.message)}}
async function removeLinked(store,id){if(!canEdit())throw Error('Sem permissão');if(!confirm('Confirma a exclusão? Esta ação é permanente.'))return;let deleting={condos:async()=>{for(let i of child('inspections','condoId',id))await cascadeInspection(i.id)},inspections:async()=>cascadeInspection(id),areas:async()=>{for(let i of child('items','areaId',id))await cascadeItem(i.id)},items:async()=>cascadeItem(id),findings:async()=>{for(let p of D.photos.filter(p=>p.findingId===id))await put('photos',{...p,findingId:''})},photos:async()=>{}};await deleting[store]();if(!['items','inspections'].includes(store))await del(store,id);if(store==='areas')state.areaId=null;if(store==='items')state.itemId=null;if(store==='inspections')state.page='inspections';await load();render();toast('Registro excluído.')}
async function cascadeItem(id){for(let f of child('findings','itemId',id))await del('findings',f.id);for(let p of child('photos','itemId',id))await del('photos',p.id);await del('items',id)}async function cascadeInspection(id){for(let f of child('findings','inspectionId',id))await del('findings',f.id);for(let p of child('photos','inspectionId',id))await del('photos',p.id);for(let i of child('items','inspectionId',id))await del('items',i.id);for(let a of child('areas','inspectionId',id))await del('areas',a.id);await del('inspections',id)}
async function applyTemplate(){if(!canEdit())throw Error('Sem permissão');if(!confirm('Adicionar os ambientes e itens do modelo básico a esta inspeção? Ambientes com o mesmo nome serão preservados.'))return;let n=child('areas','inspectionId',state.inspectionId).reduce((m,a)=>Math.max(m,Number(a.order)||0),-1)+1;for(let a of BASIC){let ex=child('areas','inspectionId',state.inspectionId).find(x=>x.name===a);let id=ex?.id||uid();if(!ex)await put('areas',{id,inspectionId:state.inspectionId,name:a,order:n++});for(let x of BASIC_ITEMS){if(!D.items.some(i=>i.areaId===id&&i.name===x))await put('items',{id:uid(),inspectionId:state.inspectionId,areaId:id,name:x,status:'Pendente',order:BASIC_ITEMS.indexOf(x)})}}await load();render();toast('Modelo aplicado à inspeção.')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}function bufToBase64(arr){let s='',u=new Uint8Array(arr);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)}function base64ToBlob(data,type){let s=atob(data),chunks=[];for(let i=0;i<s.length;i+=8192){let part=s.slice(i,i+8192),u=new Uint8Array(part.length);for(let j=0;j<part.length;j++)u[j]=part.charCodeAt(j);chunks.push(u)}return new Blob(chunks,{type})}
function escapeXml(s){return esc(s).replace(/\r/g,'').replace(/\n/g,' ')}function dateStr(s){if(!s)return 'Não informada';let [y,m,d]=s.split('-');return y&&m&&d?`${d}/${m}/${y}`:s}function reportData(id){let i=by('inspections',id);if(!i)throw Error('Inspeção não encontrada');let condo=by('condos',i.condoId),areas=child('areas','inspectionId',id).sort((a,b)=>a.order-b.order);let sections=areas.map(a=>({area:a,items:child('items','areaId',a.id).sort((a,b)=>a.order-b.order).map(item=>({item,findings:child('findings','itemId',item.id),photos:child('photos','itemId',item.id).sort((a,b)=>a.order-b.order)}))}));return {i,condo,sections,profile:by('settings','profile')||{}}}
function reportHtml(id,layout='pair'){let r=reportData(id),no=0;const p=x=>esc(x).replace(/\n/g,'<br>');return `<article class="report" id="report-document"><section class="cover">${r.profile.logo?`<img src="${esc(r.profile.logo)}" alt="Logomarca" style="max-width:330px;max-height:140px;object-fit:contain;margin:0 auto 35px">`:`<div style="font-size:25px;color:#2563eb;font-weight:850">INSPEC360</div>`}<h1>${p(r.profile.reportTitle||'LAUDO TÉCNICO DE INSPEÇÃO PREDIAL')}</h1><h2 style="border:0">${p(r.condo?.name||'Empreendimento')}</h2><p>${p([r.condo?.address,r.condo?.city,r.condo?.state].filter(Boolean).join(' · '))}</p><p>Data de referência: ${dateStr(r.i.date)}</p><p>Responsável técnico: ${p(r.i.engineer||r.profile.engineer||'Não informado')}</p><p>Registro profissional: ${p(r.i.crea||r.profile.crea||'Não informado')}</p></section><h2>1. Identificação e objeto</h2><p><b>Condomínio:</b> ${p(r.condo?.name||'')}</p><p><b>Inspeção:</b> ${p(r.i.title)}</p><p><b>Objetivo/escopo:</b> ${p(r.i.objective||'Não informado.')}</p><h2>2. Metodologia e limites</h2><p>${p(r.profile.methodology||'As observações apresentadas correspondem aos registros realizados pelo responsável técnico nos locais e itens cadastrados. A abrangência, os métodos e as limitações devem ser revisados pelo profissional responsável antes da emissão definitiva.')}</p><h2>3. Síntese quantitativa</h2><p>Ambientes registrados: ${r.sections.length}. Itens de verificação: ${r.sections.reduce((n,s)=>n+s.items.length,0)}. Fotografias: ${r.sections.reduce((n,s)=>n+s.items.reduce((m,j)=>m+j.photos.length,0),0)}.</p><h2>4. Resultados da inspeção</h2>${r.sections.map((s,a)=>`<h2>4.${a+1}. ${p(s.area.name)}</h2>${s.area.location?`<p><b>Local:</b> ${p(s.area.location)}</p>`:''}${s.items.map((it,b)=>`<h3>4.${a+1}.${b+1}. ${p(it.item.name)}</h3><p><b>Resultado:</b> ${p(it.item.status)}</p>${it.item.notes?`<p><b>Observações:</b> ${p(it.item.notes)}</p>`:''}${it.findings.map(f=>`<p><b>${p(f.title||'Constatação')}.</b> ${p(f.description||'')}</p><p><b>Classificação:</b> ${p(f.classification||'Não definida')} · <b>Prioridade:</b> ${p(f.priority||'Não definida')}</p>${f.recommendation?`<p><b>Recomendação técnica:</b> ${p(f.recommendation)}</p>`:''}`).join('')}${it.photos.length?`<div class="${layout==='pair'?'pair':''}">${it.photos.map(photo=>`<figure><img src="${urlPhoto(photo)}"><figcaption>Foto ${String(++no).padStart(3,'0')} – ${p(photo.caption||s.area.name+' – '+it.item.name)}</figcaption></figure>`).join('')}</div>`:''}`).join('')}`).join('')}<h2>5. Considerações finais e validação</h2><p>Este documento consolida os registros inseridos no sistema. Sua emissão definitiva depende da revisão do conteúdo, do escopo efetivamente realizado, das conclusões técnicas e dos requisitos profissionais aplicáveis, pelo engenheiro responsável.</p><p style="margin-top:45px;text-align:center">________________________________________<br>${p(r.i.engineer||r.profile.engineer||'Responsável técnico')}<br>${p(r.i.crea||r.profile.crea||'Registro profissional não informado')}</p></article>`}
